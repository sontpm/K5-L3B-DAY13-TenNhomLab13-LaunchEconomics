# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (DE = 1).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48 → 3.103 yêu cầu mỗi nhóm → 42 nhân viên mỗi nhóm, tổng 84 > 40 người hiện có, không làm được.
#   c) 20 nhân viên mỗi nhóm: m lớn đến đâu thì n hiệu dụng vẫn không vượt 20 / 0,02 = 1.000 < 1.251, không đạt +5 điểm.
#   d) 6 depot mỗi nhóm: trần 6 / 0,02 = 300 < 1.251, không đạt; lại dưới 20 cụm.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: cần m ≥ 299 yêu cầu mỗi nhân viên, DE = 6,96, tức 5.980 yêu cầu mỗi nhóm.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro nhân viên hai nhóm trao đổi gợi ý trong cùng depot; giảm bằng cấp quyền trợ lý theo tài khoản và log lượt mở trợ lý theo staff_id để phát hiện nhóm đối chứng dùng lén.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày chạy, không sửa khi đang chạy.
#   5. Ít nhất 20 cụm mỗi nhóm: vừa đủ, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chia theo nhân viên để tránh tràn tác động, nên chấp nhận MDE 6 điểm thay vì 5. Nếu tác động thật chỉ là 5 điểm,
#   power chỉ còn 0,64: khoảng 1/3 khả năng bỏ sót tác động có thật. Kết quả "không thấy khác biệt" không được đọc là "trợ lý không có tác dụng".
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại 4,25% (51/1.200) toàn mẫu, 3,97% trong phạm vi noi_dia + hang_nang. Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu
#   dù trợ lý không gây hại, nên dùng ngưỡng so với đối chứng (+2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Loại noi_dia và hang_nang, mọi depot; loại quoc_te (1,88× chi phí nhân viên tự làm, simulated) và doi_tac khỏi pilot"
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; 40 nhân viên → 4, 10, 20 người dùng trợ lý
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # cỡ mẫu khi chia theo yêu cầu; nhân DE ra 5.980 yêu cầu mỗi nhóm (299 × 20)
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng chạy cùng tuần, cùng depot"
    spillover_risk: "Trung bình: hai nhóm ngồi chung depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, MDE 6 điểm, ba luật dừng và ngày quyết định chốt trong file này trước khi chạy"
  stop_rules:
    - "NẾU mo_lai_trong_7_ngay nhóm trợ lý cao hơn đối chứng từ 2 điểm trở lên, hoặc vượt 6%, hoặc có từ 1 ca hoàn tiền trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ chạy tiếp bước rollout kế"
    - "NẾU chi phí mỗi yêu cầu thành công vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ thu hẹp phạm vi về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ giữ phạm vi noi_dia và hang_nang"
    - "NẾU tỉ lệ nhân viên bỏ qua gợi ý vượt 40% TRONG 1 tuần THÌ dừng mở rộng và phỏng vấn 5 nhân viên trong tuần đó KHÔNG THÌ giữ lịch rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bật cờ tắt trợ lý, có hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự xử lý như trước pilot"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "CPS 4.472 đ (simulated)"
    - "CPS theo loại: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ (simulated)"
    - "Hệ số so với nhân viên tự làm 12.000 đ: 0,22× / 0,69× / 1,88× / 0,85× (simulated)"
    - "A4: 0,38× ở 45.000 yêu cầu/tháng (simulated)"
    - "Độ nhạy B: làm lại +51,8%, xem lại +40,7%, lương +23,1% (simulated)"
    - "Chi phí cả hệ thống thấp nhất ở giới hạn 2 lần chạy: 6.901.220 đ (simulated)"
    - "Xem lại 100%: 0,98× đến 1,03× (simulated)"
    - "E1 tính thử: 82,83% / 27,12% / 4,25% (simulated)"
